<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hermes Finder</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <div class="cv-root" role="dialog" aria-labelledby="cvTitle">
    <div id="stripes"></div>
    <div class="cv-head">
      <h2 id="cvTitle">Hermes Finder</h2>
      <!-- Wiecej: pelna analiza w nowej karcie (po lewej od zamkniecia) -->
      <button class="cv-max" id="more" type="button">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M7 1.5h3.5V5M10.5 1.5 5.5 6.5M9 7.5v3H1.5V3h3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        <span id="moreLabel">More</span>
      </button>
      <button class="cv-x" id="close" type="button" aria-label="Close panel">×</button>
    </div>
    <div class="cv-body" id="body" aria-live="polite"></div>
  </div>
  <script src="../shared/langdetect.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/settings.js"></script>
  <script src="../shared/render.js"></script>
  <script src="../shared/api.js"></script>
  <script src="panel.js"></script>
</body>
</html>
